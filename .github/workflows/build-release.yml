name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: Windows-x86_64
            os: Windows
            spec: packaging/tron3dviewer-windows.spec
            artifact: tron3dviewer-Windows-x86_64.exe
          - runner: macos-14
            name: macOS-arm64
            os: macOS
            spec: packaging/tron3dviewer-mac.spec
            artifact: tron3dviewer-macOS-arm64.dmg
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create Windows application icon
        if: matrix.os == 'Windows'
        run: uv run python packaging/make_ico.py

      - name: Create macOS application icon
        if: matrix.os == 'macOS'
        run: uv run python packaging/make_icns.py

      - name: Build application
        run: uv run --with pyinstaller pyinstaller --noconfirm --clean "${{ matrix.spec }}"

      - name: Name Windows executable
        if: matrix.os == 'Windows'
        run: Copy-Item dist/tron3dviewer.exe "dist/${{ matrix.artifact }}"

      - name: Create DMG
        if: matrix.os == 'macOS'
        run: |
          rm -rf build/dmg
          mkdir -p build/dmg
          ditto dist/tron3dviewer.app build/dmg/tron3dviewer.app
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname tron3dviewer \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "dist/${{ matrix.artifact }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tron3dviewer-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: tron3dviewer-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: sha256sum release/tron3dviewer-* > release/SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "Tron 3D viewer $GITHUB_REF_NAME" \
              --generate-notes
          fi
