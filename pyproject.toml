[project]
name = "tron3d"
version = "0.1.0"
description = "Open-source 3D microscopy volume viewer with PDF export"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.12,<4",
    "numpy>=1.26,<3",
    "Pillow>=11,<13",
    "PyOpenGL>=3.1,<4",
    "PySide6-Essentials>=6.8,<7",
    "pyqtdarktheme-fork>=2.3.0,<3",
    "tifffile>=2025.1.10",
    "vispy>=0.15,<0.16",
    "pypdf>=6,<7",
]

[project.scripts]
tron3d = "tron3d.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tron3d"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
